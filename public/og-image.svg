    <text x="70" y="250" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800">Stranger<tspan fill="#34d399">Chat</tspan></text>
    <text x="74" y="322" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500">Anonymous. Encrypted. Ephemeral.</text>
    <text x="74" y="382" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="25">Start private conversations with strangers using optional interest filters.</text>
