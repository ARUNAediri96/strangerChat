      <rect x="0" y="0" width="96" height="96" rx="24" fill="url(#accent)" opacity="0.20" stroke="#34d399" stroke-opacity="0.35"/>
      <path d="M48 18 76 30v21c0 23-15 43-28 49-13-6-28-26-28-49V30l28-12Z" fill="none" stroke="#34d399" stroke-width="7" stroke-linejoin="round"/>
