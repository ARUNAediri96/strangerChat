<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">StrangerChat</title>
  <desc id="desc">Anonymous encrypted chat with strangers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="0.55" stop-color="#0b1725"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="80" r="260" fill="#14b8a6" opacity="0.12"/>
  <circle cx="140" cy="560" r="230" fill="#34d399" opacity="0.10"/>
  <g transform="translate(90 90)">
    <rect x="0" y="0" width="1020" height="450" rx="32" fill="#ffffff" opacity="0.035" stroke="#ffffff" stroke-opacity="0.10"/>
